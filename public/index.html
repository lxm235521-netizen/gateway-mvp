<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI Gateway Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.3.14/dist/index.css" />
    <script src="https://cdn.jsdelivr.net/npm/element-plus@2.3.14/dist/index.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.1.0/dist/index.iife.min.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; margin: 0; background-color: #f0f2f5; }
        .login-container { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { width: 400px; padding: 20px; }
        .admin-container { display: flex; height: 100vh; }
        .sidebar { width: 200px; background-color: #304156; color: #fff; }
        .main-content { flex: 1; padding: 20px; overflow-y: auto; }
        .el-menu-vertical { border-right: none; background-color: #304156; }
        .el-menu-item { color: #bfcbd9; }
        .el-menu-item.is-active { color: #409EFF; }
        .binding-card { border: 1px solid #dcdfe6; border-radius: 6px; padding: 14px; margin-bottom: 14px; background: #fff; }
        .binding-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .mono textarea { font-family: Consolas, Monaco, monospace; }
    </style>
</head>
<body>
<div id="app">
    <div v-if="!isLoggedIn" class="login-container">
        <el-card class="login-card">
            <template #header><h2>AI Gateway 管理后台</h2></template>
            <el-form :model="loginForm" @keyup.enter="login">
                <el-form-item><el-input v-model="loginForm.username" placeholder="用户名"></el-input></el-form-item>
                <el-form-item><el-input v-model="loginForm.password" type="password" placeholder="密码" show-password></el-input></el-form-item>
                <el-button type="primary" style="width: 100%;" @click="login" :loading="loading">登 录</el-button>
            </el-form>
        </el-card>
    </div>

    <div v-else class="admin-container">
        <div class="sidebar">
            <div style="padding: 20px; text-align: center; font-size: 18px; font-weight: bold;">AI Gateway</div>
            <el-menu :default-active="activeTab" class="el-menu-vertical" @select="handleSelect">
                <el-menu-item index="models"><span>模型与映射</span></el-menu-item>
                <el-menu-item index="channels"><span>上游渠道管理</span></el-menu-item>
                <el-menu-item index="keys"><span>网关密钥分发</span></el-menu-item>
                <el-menu-item index="logout" @click="logout"><span>退出登录</span></el-menu-item>
            </el-menu>
        </div>

        <div class="main-content">
            <div v-if="activeTab === 'models'">
                <div style="margin-bottom: 20px;"><el-button type="primary" @click="openModelDialog()">新增逻辑模型</el-button></div>
                <el-table :data="models" border style="width: 100%">
                    <el-table-column type="expand">
                        <template #default="scope">
                            <el-table :data="scope.row.bindings" border size="small">
                                <el-table-column prop="id" label="绑定ID" width="80"></el-table-column>
                                <el-table-column prop="channel_name" label="渠道" width="160"></el-table-column>
                                <el-table-column prop="route_path" label="请求路由"></el-table-column>
                                <el-table-column prop="weight" label="权重" width="80"></el-table-column>
                                <el-table-column label="任务" width="90"><template #default="b"><el-tag :type="b.row.is_async ? 'warning' : 'success'">{{ b.row.is_async ? '异步' : '同步' }}</el-tag></template></el-table-column>
                                <el-table-column label="视频内容" width="110"><template #default="b"><el-tag :type="b.row.proxy_content ? 'primary' : 'info'">{{ b.row.proxy_content ? '网关代理' : '返回直链' }}</el-tag></template></el-table-column>
                                <el-table-column label="状态" width="100"><template #default="b"><el-tag :type="b.row.status && b.row.channel_status ? 'success' : 'danger'">{{ b.row.status && b.row.channel_status ? '可用' : '禁用' }}</el-tag></template></el-table-column>
                            </el-table>
                        </template>
                    </el-table-column>
                    <el-table-column prop="id" label="ID" width="70"></el-table-column>
                    <el-table-column prop="model_name" label="下游模型名"></el-table-column>
                    <el-table-column label="绑定渠道数" width="120"><template #default="scope">{{ scope.row.bindings ? scope.row.bindings.length : 0 }}</template></el-table-column>
                    <el-table-column label="状态" width="100"><template #default="scope"><el-tag :type="scope.row.status ? 'success' : 'danger'">{{ scope.row.status ? '启用' : '禁用' }}</el-tag></template></el-table-column>
                    <el-table-column label="操作" width="180" fixed="right">
                        <template #default="scope">
                            <el-button size="small" type="primary" link @click="openModelDialog(scope.row)">编辑</el-button>
                            <el-button size="small" type="success" link @click="cloneModel(scope.row)">复制</el-button>
                        </template>
                    </el-table-column>
                </el-table>
            </div>

            <div v-if="activeTab === 'channels'">
                <div style="margin-bottom: 20px;"><el-button type="primary" @click="openChannelDialog()">新增上游渠道</el-button></div>
                <el-table :data="channels" border style="width: 100%">
                    <el-table-column prop="id" label="ID" width="60"></el-table-column>
                    <el-table-column prop="name" label="渠道名称" width="200"></el-table-column>
                    <el-table-column prop="base_url" label="Base URL"></el-table-column>
                    <el-table-column label="默认密钥"><template #default="scope">{{ scope.row.api_key ? '已设置' : '未设置' }}</template></el-table-column>
                    <el-table-column label="状态" width="100"><template #default="scope"><el-tag :type="scope.row.status ? 'success' : 'danger'">{{ scope.row.status ? '启用' : '禁用' }}</el-tag></template></el-table-column>
                    <el-table-column label="操作" width="120" fixed="right"><template #default="scope"><el-button size="small" type="primary" link @click="openChannelDialog(scope.row)">编辑</el-button></template></el-table-column>
                </el-table>
            </div>

            <div v-if="activeTab === 'keys'">
                <div style="margin-bottom: 20px;"><el-button type="primary" @click="openKeyDialog()">签发新 Key</el-button></div>
                <el-table :data="keys" border style="width: 100%">
                    <el-table-column prop="id" label="ID" width="60"></el-table-column>
                    <el-table-column prop="api_key" label="网关 API Key" width="300"></el-table-column>
                    <el-table-column prop="quota" label="总额度"></el-table-column>
                    <el-table-column prop="used_quota" label="已用额度"></el-table-column>
                    <el-table-column label="状态" width="100"><template #default="scope"><el-tag :type="scope.row.status ? 'success' : 'danger'">{{ scope.row.status ? '正常' : '已禁用' }}</el-tag></template></el-table-column>
                    <el-table-column label="操作" width="120" fixed="right"><template #default="scope"><el-button size="small" type="primary" link @click="openKeyDialog(scope.row)">编辑/充值</el-button></template></el-table-column>
                </el-table>
            </div>

            <el-dialog :title="dialogForm.id ? '编辑逻辑模型' : '新增逻辑模型'" v-model="dialogVisible" width="1100px" top="3vh">
                <el-form :model="dialogForm" label-position="top">
                    <div style="display: grid; grid-template-columns: 1fr 200px; gap: 20px;">
                        <el-form-item label="下游请求模型名"><el-input v-model="dialogForm.model_name" placeholder="例如: sora-video"></el-input></el-form-item>
                        <el-form-item label="模型状态"><el-switch v-model="dialogForm.status" :active-value="1" :inactive-value="0" active-text="启用" inactive-text="禁用"></el-switch></el-form-item>
                    </div>
                    <el-divider content-position="left">渠道绑定</el-divider>
                    <div v-for="(binding, index) in dialogForm.bindings" :key="binding.local_id" class="binding-card">
                        <div class="binding-title">
                            <strong>绑定 {{ index + 1 }}：{{ channelName(binding.channel_id) }}</strong>
                            <div>
                                <el-button size="small" @click="cloneBinding(index)">复制绑定</el-button>
                                <el-button size="small" type="danger" @click="removeBinding(index)">删除/禁用</el-button>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 120px 120px; gap: 0 16px;">
                            <el-form-item label="选择渠道"><el-select v-model="binding.channel_id" style="width:100%"><el-option v-for="c in channels" :key="c.id" :label="c.name" :value="c.id"></el-option></el-select></el-form-item>
                            <el-form-item label="上游请求路由"><el-input v-model="binding.route_path" placeholder="/v1/videos"></el-input></el-form-item>
                            <el-form-item label="权重"><el-input-number v-model="binding.weight" :min="1" style="width:100%"></el-input-number></el-form-item>
                            <el-form-item label="启用"><el-switch v-model="binding.status" :active-value="1" :inactive-value="0"></el-switch></el-form-item>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 16px;">
                            <el-form-item label="任务类型"><el-switch v-model="binding.is_async" :active-value="1" :inactive-value="0" active-text="异步" inactive-text="同步"></el-switch></el-form-item>
                            <el-form-item label="视频内容访问"><el-switch v-model="binding.proxy_content" :active-value="1" :inactive-value="0" active-text="网关代理" inactive-text="返回直链"></el-switch></el-form-item>
                            <el-form-item label="绑定级 API Key（为空则使用渠道默认密钥）"><el-input v-model="binding.api_key" show-password></el-input></el-form-item>
                        </div>
                        <el-form-item label="请求报文映射规则 (JSONata)" class="mono"><el-input type="textarea" :rows="5" v-model="binding.req_mapping"></el-input></el-form-item>
                        <el-form-item label="响应报文映射规则 (JSONata)" class="mono"><el-input type="textarea" :rows="4" v-model="binding.resp_mapping"></el-input></el-form-item>
                        <div v-if="binding.is_async === 1">
                            <el-form-item label="轮询路由路径 (支持 ${up_task_id})"><el-input v-model="binding.poll_path"></el-input></el-form-item>
                            <el-form-item label="轮询响应提取规则 (JSONata)" class="mono"><el-input type="textarea" :rows="4" v-model="binding.poll_mapping"></el-input></el-form-item>
                        </div>
                    </div>
                    <el-button style="width:100%;" @click="addBinding">+ 添加渠道绑定</el-button>
                </el-form>
                <template #footer>
                    <el-button @click="dialogVisible = false">取消</el-button>
                    <el-button type="primary" @click="saveModel">保存</el-button>
                </template>
            </el-dialog>

            <el-dialog :title="channelForm.id ? '编辑渠道' : '新增渠道'" v-model="channelDialogVisible" width="500px">
                <el-form :model="channelForm" label-position="top">
                    <el-form-item label="渠道名称"><el-input v-model="channelForm.name"></el-input></el-form-item>
                    <el-form-item label="上游 BaseURL"><el-input v-model="channelForm.base_url"></el-input></el-form-item>
                    <el-form-item label="渠道默认密钥"><el-input v-model="channelForm.api_key" show-password></el-input></el-form-item>
                    <el-form-item label="是否启用"><el-switch v-model="channelForm.status" :active-value="1" :inactive-value="0"></el-switch></el-form-item>
                </el-form>
                <template #footer><el-button @click="channelDialogVisible = false">取消</el-button><el-button type="primary" @click="saveChannel">保存渠道</el-button></template>
            </el-dialog>

            <el-dialog :title="keyForm.id ? '编辑 Key / 充值' : '签发新 Key'" v-model="keyDialogVisible" width="500px">
                <el-form :model="keyForm" label-position="top">
                    <el-form-item label="网关 API Key"><el-input v-model="keyForm.api_key" :disabled="!!keyForm.id"><template #append v-if="!keyForm.id"><el-button @click="generateKeyString">随机生成</el-button></template></el-input></el-form-item>
                    <el-form-item label="分配总额度"><el-input-number v-model="keyForm.quota" :min="0" :step="1000" style="width: 100%;"></el-input-number></el-form-item>
                    <el-form-item label="是否启用"><el-switch v-model="keyForm.status" :active-value="1" :inactive-value="0"></el-switch></el-form-item>
                </el-form>
                <template #footer><el-button @click="keyDialogVisible = false">取消</el-button><el-button type="primary" @click="saveKey">保存配置</el-button></template>
            </el-dialog>
        </div>
    </div>
</div>

<script>
const { createApp, ref, reactive } = Vue;

const app = createApp({
    setup() {
        const isLoggedIn = ref(false);
        const activeTab = ref("models");
        const loading = ref(false);
        const loginForm = reactive({ username: "admin", password: "" });
        const token = ref(localStorage.getItem("admin_token") || "");
        const models = ref([]);
        const channels = ref([]);
        const keys = ref([]);
        const dialogVisible = ref(false);
        const dialogForm = ref({});
        const channelDialogVisible = ref(false);
        const channelForm = ref({});
        const keyDialogVisible = ref(false);
        const keyForm = ref({});

        if (token.value) { isLoggedIn.value = true; fetchData(); }

        async function requestApi(path, method = "GET", body = null) {
            try {
                const res = await fetch(`/admin${path}`, {
                    method,
                    headers: { "Authorization": `Bearer ${token.value}`, "Content-Type": "application/json" },
                    body: body ? JSON.stringify(body) : null
                });
                const data = await res.json();
                if (res.status === 401) { ElementPlus.ElMessage.warning("会话已过期，请重新登录"); logout(); return null; }
                if (res.status !== 200) { ElementPlus.ElMessage.error(data.error || "请求失败"); return null; }
                return data;
            } catch (e) { ElementPlus.ElMessage.error("网络请求异常"); return null; }
        }

        async function login() {
            if (!loginForm.username || !loginForm.password) return ElementPlus.ElMessage.warning("请输入账号和密码");
            loading.value = true;
            try {
                const res = await fetch("/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(loginForm) });
                const data = await res.json();
                if (data.success) {
                    token.value = data.token;
                    localStorage.setItem("admin_token", data.token);
                    isLoggedIn.value = true;
                    await fetchData();
                    ElementPlus.ElMessage.success("登录成功");
                } else { ElementPlus.ElMessage.error(data.error || "账号或密码错误"); }
            } catch (e) { ElementPlus.ElMessage.error("网络连接失败"); }
            finally { loading.value = false; }
        }

        function logout() { localStorage.removeItem("admin_token"); isLoggedIn.value = false; token.value = ""; }
        function handleSelect(index) { activeTab.value = index; }
        async function fetchData() {
            const m = await requestApi("/models"); if (m) models.value = m;
            const c = await requestApi("/channels"); if (c) channels.value = c;
            const k = await requestApi("/keys"); if (k) keys.value = k;
        }

        function defaultBinding() {
            return {
                local_id: Math.random().toString(36).slice(2),
                channel_id: channels.value.length > 0 ? channels.value[0].id : null,
                route_path: "/v1/videos",
                poll_path: "/v1/videos/${up_task_id}",
                api_key: "",
                is_async: 1,
                proxy_content: 0,
                req_mapping: "{\n  \"model\": model,\n  \"prompt\": prompt\n}",
                resp_mapping: "{\n  \"task_id\": id,\n  \"status\": status\n}",
                poll_mapping: "{\n  \"status\": status,\n  \"progress\": progress,\n  \"video_url\": video_url\n}",
                weight: 1,
                status: 1
            };
        }

        function normalizeBinding(binding) {
            return { ...defaultBinding(), ...binding, local_id: Math.random().toString(36).slice(2) };
        }

        function openModelDialog(row = null) {
            if (row) {
                dialogForm.value = JSON.parse(JSON.stringify(row));
                dialogForm.value.bindings = (dialogForm.value.bindings || []).map(normalizeBinding);
            } else {
                dialogForm.value = { model_name: "", status: 1, bindings: [defaultBinding()] };
            }
            dialogVisible.value = true;
        }

        function cloneModel(row) {
            openModelDialog(row);
            delete dialogForm.value.id;
            dialogForm.value.model_name = `${dialogForm.value.model_name}_copy`;
            dialogForm.value.bindings.forEach(binding => delete binding.id);
            ElementPlus.ElMessage.info("已复制模型配置");
        }

        function addBinding() { dialogForm.value.bindings.push(defaultBinding()); }
        function cloneBinding(index) {
            const copy = JSON.parse(JSON.stringify(dialogForm.value.bindings[index]));
            delete copy.id;
            copy.local_id = Math.random().toString(36).slice(2);
            dialogForm.value.bindings.splice(index + 1, 0, copy);
        }
        function removeBinding(index) {
            const binding = dialogForm.value.bindings[index];
            if (binding.id) binding.status = 0;
            else dialogForm.value.bindings.splice(index, 1);
        }
        function channelName(channelId) {
            const channel = channels.value.find(item => item.id === channelId);
            return channel ? channel.name : "未选择渠道";
        }

        async function saveModel() {
            if (!dialogForm.value.model_name) return ElementPlus.ElMessage.warning("请填写模型名");
            if (!dialogForm.value.bindings || dialogForm.value.bindings.length === 0) return ElementPlus.ElMessage.warning("请至少配置一个渠道绑定");
            for (const binding of dialogForm.value.bindings) {
                if (!binding.channel_id || !binding.route_path) return ElementPlus.ElMessage.warning("每个绑定都需要渠道和路由");
            }
            const method = dialogForm.value.id ? "PUT" : "POST";
            const path = dialogForm.value.id ? `/models/${dialogForm.value.id}` : "/models";
            const res = await requestApi(path, method, dialogForm.value);
            if (res && res.success) { ElementPlus.ElMessage.success("保存成功"); dialogVisible.value = false; fetchData(); }
        }

        function openChannelDialog(row = null) { channelForm.value = row ? JSON.parse(JSON.stringify(row)) : { status: 1 }; channelDialogVisible.value = true; }
        async function saveChannel() {
            if (!channelForm.value.name || !channelForm.value.base_url) return ElementPlus.ElMessage.warning("名称和URL不能为空");
            const method = channelForm.value.id ? "PUT" : "POST";
            const path = channelForm.value.id ? `/channels/${channelForm.value.id}` : "/channels";
            const res = await requestApi(path, method, channelForm.value);
            if (res && res.success) { ElementPlus.ElMessage.success("保存成功"); channelDialogVisible.value = false; fetchData(); }
        }

        function generateKeyString() { keyForm.value.api_key = "sk-" + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15); }
        function openKeyDialog(row = null) {
            keyForm.value = row ? JSON.parse(JSON.stringify(row)) : { quota: 10000, status: 1 };
            if (!row) generateKeyString();
            keyDialogVisible.value = true;
        }
        async function saveKey() {
            if (!keyForm.value.api_key) return ElementPlus.ElMessage.warning("API Key不能为空");
            const method = keyForm.value.id ? "PUT" : "POST";
            const path = keyForm.value.id ? `/keys/${keyForm.value.id}` : "/keys";
            const res = await requestApi(path, method, keyForm.value);
            if (res && res.success) { ElementPlus.ElMessage.success("保存成功"); keyDialogVisible.value = false; fetchData(); }
        }

        return {
            isLoggedIn, activeTab, loading, loginForm, login, logout, handleSelect,
            models, channels, keys, dialogVisible, dialogForm, openModelDialog, saveModel, cloneModel,
            addBinding, cloneBinding, removeBinding, channelName,
            channelDialogVisible, channelForm, openChannelDialog, saveChannel,
            keyDialogVisible, keyForm, openKeyDialog, saveKey, generateKeyString
        };
    }
});

if (typeof ElementPlusIconsVue !== "undefined") {
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
        app.component('icon-' + key.toLowerCase(), component);
        app.component(key, component);
    }
}
app.use(ElementPlus, { zIndex: 3000 });
app.mount("#app");
</script>
</body>
</html>
